spring:
  application:
    name: backend

  datasource:
    url: 'jdbc:postgresql://ep-long-river-b48bmnwr-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require'
    username: 'neondb_owner'
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  auth:
    token-secret: ${APP_TOKEN_SECRET}