spring:
  application:
    name: backend

  # Defaults point at the local Postgres from docker-compose.yml; the host sets the real values.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/eventhub}
    username: ${DATABASE_USERNAME:eventhub}
    password: ${DATABASE_PASSWORD:eventhub}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  auth:
    token-secret: ${APP_TOKEN_SECRET}