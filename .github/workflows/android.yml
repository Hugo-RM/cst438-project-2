name: Android CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when new commits are pushed to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle dependencies and validates the wrapper jar
      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Testcontainers uses the runner's Docker daemon
      - name: Run backend tests
        run: ./gradlew :backend:test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            backend/build/reports/tests/
